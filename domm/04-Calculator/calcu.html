<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Calculator</title>
     <style>
          * {
               margin: 0;
               padding: 0;
               box-sizing: border-box;
               font-family: Arial, sans-serif;
          }

          body {
               height: 100vh;
               display: flex;
               justify-content: center;
               align-items: center;
               background: linear-gradient(135deg, #141e30, #243b55);
          }

          .calculator {
               width: 300px;
               background: #111;
               border-radius: 15px;
               padding: 20px;
               box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
          }

          #display {
               width: 100%;
               height: 60px;
               margin-bottom: 15px;
               font-size: 26px;
               text-align: right;
               padding: 10px;
               border: none;
               border-radius: 8px;
               background: #000;
               color: #0f0;
          }

          .buttons {
               display: grid;
               grid-template-columns: repeat(4, 1fr);
               gap: 10px;
          }

          button {
               height: 50px;
               font-size: 18px;
               border: none;
               border-radius: 8px;
               cursor: pointer;
               background: #222;
               color: #fff;
               transition: 0.2s;
          }

          button:hover {
               background: #333;
          }

          .equal {
               background: #0f9d58;
          }

          .equal:hover {
               background: #0c7c44;
          }

          .zero {
               grid-column: span 2;
          }
     </style>
</head>

<body>
     <div class="calculator">
          <input type="text" id="display" readonly>

          <div class="buttons">
               <button id="clearBtn" >C</button>
               <button id="backspaceBtn" >⌫</button>
               <button id="percentageBtn" >%</button>
               <button id="divideBtn" >÷</button>

               <button id="sevenBtn" >7</button>
               <button id="eightBtn" >8</button>
               <button id="nineBtn" >9</button>
               <button id="multiplyBtn" >×</button>

               <button id="fourBtn" >4</button>
               <button id="fiveBtn" >5</button>
               <button id="sixBtn" >6</button>
               <button id="subtractBtn" >−</button>

               <button id="oneBtn" >1</button>
               <button id="twoBtn" >2</button>
               <button id="threeBtn" >3</button>
               <button id="addBtn" >+</button>

               <button id="zeroBtn"  class="zero">0</button>
               <button id="decimalBtn" >.</button>
               <button id="equalBtn"  class="equal">=</button>
          </div>
     </div>

     <script>
          const display = document.getElementById('display');
          const buttons = document.querySelectorAll('.buttons button');

          buttons.forEach(button => {
               button.addEventListener('click', () => {
                    const value = button.textContent;

                    if (value === 'C') {
                         display.value = '';
                    } else if (value === '⌫') {
                         display.value = display.value.slice(0, -1);
                    } else if (value === '=') {
                         try {
                              const result = eval(display.value.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-'));
                              display.value = result;
                         } catch (error) {
                              display.value = 'Error';
                         }
                    } else {
                         display.value += value;
                    }
               });
          });
     </script>
</body>

</html>
