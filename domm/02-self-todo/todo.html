<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Self Todo List</title>

     <style>
          * {
               margin: 0;
               padding: 0;
               box-sizing: border-box;
          }
          body {
               font-family: Arial, sans-serif;
               background-color: #f4f4f4;
               margin: 0;
               padding: 20px;
          }

          h1 {
               text-align: center;
               color: #333;
          }
          .todo-container {
               max-width: 600px;
               margin: 0 auto;
               background-color: #fff;
               padding: 20px;
               box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          }
          .todo-input {
               width: calc(100% - 22px);
               padding: 10px;
               margin-bottom: 10px;
               border: 1px solid #ccc;
               border-radius: 4px;
          }
          .add-button {
               width: 100%;
               padding: 10px;
               font-size: 20px;
               text-transform: uppercase;
               word-spacing: 2px;
               letter-spacing: 2px;
               background-color: #28a745;
               color: white;
               border: none;
               border-radius: 4px;
               cursor: pointer;
          }
          .add-button:hover {
               background-color: #218838;
          }
          .todo-list {
               /* list-style-type: none; */
               padding: 20px;
          }
          .todo-item {
               display: flex;
               justify-content: space-between;
               align-items: center;
               padding: 10px;
               border-bottom: 1px solid #ccc;
          }
          .todo-item:hover {
               background-color: #f6f4f4;
               /* color: #f4f4f4; */
               border-radius: 5px;
          }
          .delete-button {
               padding: 5px 8px;
               background-color: #dc3545;
               color: white;
               border: none;
               border-radius: 100%;
               cursor: pointer;
          }
          .delete-button:hover {
               background-color: #c82333;
          }
     </style>
</head>
<body>
     <h1>My Todo List</h1>
     <div class="todo-container">
          <input type="text" id="todo-input" class="todo-input" placeholder="Enter a new todo...">

          <button id="add-button" class="add-button">Add Todo</button>

          <ul id="todo-list" class="todo-list">
               <!-- <li class="todo-item">To Do 
                    <button class="delete-button"> X </button>
               </li> -->
          </ul>
     </div>


     <script>
          const addButton = document.getElementById('add-button');
          const inputText = document.getElementById('todo-input');
          const todoList = document.getElementById('todo-list');

          addButton.addEventListener('click', ()=>{
               // const todoText = inputText.value.trim();

               const li = document.createElement('li');
               li.className = 'todo-item';
               li.textContent = inputText.value.trim(); //textContent adds text inside the element.<li>textContent = "Hello World" will add "Hello World" inside the <li> element.

               todoList.appendChild(li); //appendChild adds the element as a child of the parent element. todoList.appendChild(li) will add the <li> element as a child of the <ul> element with id "todo-list".
               inputText.value = ''; //clear the input field after adding the todo item


               const deleteButton = document.createElement('button');
               deleteButton.className = 'delete-button';
               deleteButton.textContent = 'X'; // design button UI. throuhgh textContent we can add text inside the button element. deleteButton.textContent = "X" will add "X" inside the button element.

               // Note - can use id in place of className but it is not recommended as id should be unique and we will have multiple delete buttons in the list. So, we will use className to style the delete buttons.

               deleteButton.addEventListener('click', ()=>{
                    todoList.removeChild(li); //removeChild removes the child element from the parent element. todoList.removeChild(li) will remove the <li> element from the <ul> element with id "todo-list".
               });
               li.appendChild(deleteButton); //  delete button appears on the right side of the li element as we have used flexbox to style the todo-item class. The delete button is added as a child of the li element so that it appears on the right side of the li element.
          })

          //                todoList.removeChild(li);
          //           });

          //           li.appendChild(deleteButton);
          //           todoList.appendChild(li);
          //           todoInput.value = '';
          //      }
          // });
          
     </script>
</body>
</html>
