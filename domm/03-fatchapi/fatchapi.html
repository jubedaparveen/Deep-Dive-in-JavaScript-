<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Fatch API</title>
     <style>
          *{
               margin: 0;
               padding: 0;
               box-sizing: border-box;
          }
          .bodyDec{
               display: flex;
               justify-content: center;
               align-items: center;
               height: 100vh;
               background-color: #000;
               color: #fff;
               font-family: Arial, sans-serif;
          }
          .container{
               width: 700px;
               /* text-align: center; */
               background-color: #222;
               padding: 40px;
               border-radius: 10px;
               box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
          }
          .fetchBtn{
               padding: 10px 20px;
               font-size: 16px;
               cursor: pointer;
               background-color: #007BFF;
               color: #fff;
               border: none;
               border-radius: 5px;
               margin: 20px 0px;
          }
          .fetchBtn:hover{
               background-color: #0056b3;
          }
          .result{
               margin: 20px 0px;
               padding: 20px;
               background-color: #333;
               border-radius: 5px;
          }
          .result li{
               margin-bottom: 15px;
          }
     </style>
</head>
<body class="bodyDec">
     <div class="container">
          <h1>Fatch API</h1>
     <button id="fetchBtn" class="fetchBtn">Fetch Data</button>
          <div id="result" class="result"></div>
     </div>
    

     <script>
          const fetchBtn = document.getElementById('fetchBtn');
          const resultDiv = document.getElementById('result');

          (async ()=>{
               fetch('https://api.freeapi.app/api/v1/public/randomjokes',{method:'GET'})
               .then((response) => response.json())
               .then((data) => {
                   for (const joke of data.data.data) {
                        const li = document.createElement('li');
                        li.innerText = joke.content;
                        resultDiv.appendChild(li);
                   }
               });
          })();
